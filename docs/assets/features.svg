 stroke="#ebe7da" stroke-width="2"/><rect x="62" y="352" width="52" height="52" rx="16" fill="#eef9d3"/><g transform="translate(75,365) scale(1.0833333333333333)" fill="none" stroke="#3d5a0f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7M7 19a2 2 0 100-4 2 2 0 000 4zM17 19a2 2 0 100-4 2 2 0 000 4z"/></g><text x="62" y="438" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#1c2415" text-anchor="start" >Courier tracking</text><text x="62" y="466" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#576b47" text-anchor="start" >Signed webhooks update tracking</text><text x="62" y="487" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#576b47" text-anchor="start" >live. Replays and forgeries are</text><text x="62" y="508" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#576b47" text-anchor="start" >rejected.</text><rect x="352" y="330" width="290" height="208" rx="24" fill="#ffffff" stroke="#ebe7da" stroke-width="2"/><rect x="374" y="352" width="52" height="52" rx="16" fill="#eef9d3"/><g transform="translate(387,365) scale(1.0833333333333333)" fill="none" stroke="#3d5a0f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/></g><text x="374" y="438" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#1c2415" text-anchor="start" >Inventory ledger</text><text x="374" y="466" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#576b47" text-anchor="start" >Every