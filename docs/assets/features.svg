nt-size="22" font-weight="800" fill="#1c2415" text-anchor="start" >Team and access</text><text x="998" y="466" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#576b47" text-anchor="start" >Join with a business code. No</text><text x="998" y="487" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#576b47" text-anchor="start" >access until the owner approves.</text></svg>