<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210" role="img" aria-label="Voice safety"><title>Voice safety</title><defs></defs><rect width="1280" height="210" rx="28" fill="#1c2415"/><circle cx="1180" cy="30" r="150" fill="#c5f26a" opacity=".08"/><g transform="translate(52,48) scale(1.6666666666666667)" fill="none" stroke="#c5f26a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></g><text x="112" y="80" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="start" >The voice proposes. The owner decides.</text><text x="52" y="124" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#cfe9a0" text-anchor="start" >A misheard word must never cost money. Every change is read back and needs a spoken yes.</text><rect x="52" y="152" width="194" height="36" rx="18.0" fill="#2f3e24"/><text x="149.0" y="175.25" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#c5f26a" text-anchor="middle" >One-time proposals</text><rect x="256" y="152" width="167" height="36" rx="18.0" fill="#2f3e24"/><text x="339.5" y="175.25" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#c5f26a" text-anchor="middle" >2-minute expiry</text><rect x="433" y="152" width="275" height="36" rx="18.0" fill="#2f3e24"/><text x="570.5" y="175.25" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#c5f26a" text-anchor="middle" >Bound to your login session</text><rect x="718" y="152" width="257" height="36" rx="18.0" fill="#2f3e24"/><text x="846.5" y="175.25" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#c5f26a" text-anchor="middle" >Cancel needs “yes cancel”</text><rect x="985" y="152" width="239" height="36" rx="18.0" fill="#2f3e24"/><text x="1104.5" y="175.25" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#c5f26a" text-anchor="middle" >Key stays on the server</text></svg>